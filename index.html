const D=RAW.split('\n').map(r=>{const[d,s,w,p]=r.split(',');const[m,dd]=d.split('/').map(Number);return{d,m,dd,s:+s,w:+w,p:+p}});
D.forEach((r,i)=>{r.chg=i?r.s-D[i-1].s:0});
const N=D.length;
const $=id=>document.getElementById(id);
const fmt=(v,n=0)=>v.toLocaleString('zh-TW',{minimumFractionDigits:n,maximumFractionDigits:n});
const sgn=(v,n=0,suf='')=>(v>0?'+':v<0?'−':'±')+fmt(Math.abs(v),n)+suf;
const cls=v=>v>0?'pos':v<0?'neg':'';
const mv=r=>r.s*1000*r.p/1e8;

const fromSel=$('from'),toSel=$('to');
D.forEach((r,i)=>{fromSel.add(new Option(r.d,i));toSel.add(new Option(r.d,i))});
let lo=0,hi=N-1;

function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
let C={};
function readColors(){C={bar:css('--bar'),barHi:css('--bar-hi'),price:css('--price'),weight:css('--weight'),fg:css('--fg'),muted:css('--muted'),line:css('--line'),panel:css('--panel')}}
readColors();

const notesPlugin={id:'notes',afterDatasetsDraw(ch){
  const sl=D.slice(lo,hi+1);if(sl.length<2)return;
  const c=ch.ctx,area=ch.chartArea;c.save();c.font='500 11px "IBM Plex Mono",monospace';
  let iMax=0,iMin=0,iW=0;sl.forEach((r,i)=>{if(r.p>sl[iMax].p)iMax=i;if(r.p<sl[iMin].p)iMin=i;if(r.w>sl[iW].w)iW=i});
  const items=[{ds:0,i:iMax,t:'高 '+fmt(sl[iMax].p,sl[iMax].p%1?1:0),col:C.price,up:true},
               {ds:0,i:iMin,t:'低 '+fmt(sl[iMin].p,sl[iMin].p%1?1:0),col:C.price,up:false},
               {ds:1,i:iW,t:'權重高 '+sl[iW].w.toFixed(2)+'%',col:C.weight,up:false}];
  const boxes=[];
  items.forEach(it=>{
    const el=ch.getDatasetMeta(it.ds).data[it.i];if(!el)return;
    const x=el.x,y=el.y,w=c.measureText(it.t).width+10,h=18;
    let bx=Math.min(Math.max(x-w/2,area.left+2),area.right-w-2);
    let by=it.up?y-h-10:y+10;
    if(by<area.top+2)by=y+10; if(by+h>area.bottom-2)by=y-h-10;
    for(const b of boxes){if(bx<b.x+b.w&&bx+w>b.x&&by<b.y+b.h&&by+h>b.y){by=it.up?b.y-h-4:b.y+b.h+4}}
    boxes.push({x:bx,y:by,w,h});
    c.beginPath();c.moveTo(x,y);c.lineTo(Math.min(Math.max(x,bx+4),bx+w-4),by<y?by+h:by);c.strokeStyle=it.col;c.lineWidth=1;c.setLineDash([2,2]);c.stroke();c.setLineDash([]);
    c.beginPath();c.arc(x,y,4,0,7);c.fillStyle=it.col;c.fill();c.lineWidth=2;c.strokeStyle=C.panel;c.stroke();
    c.fillStyle=C.panel;c.fillRect(bx,by,w,h);c.strokeStyle=it.col;c.lineWidth=1;c.strokeRect(bx+.5,by+.5,w-1,h-1);
    c.fillStyle=C.fg;c.textBaseline='middle';c.fillText(it.t,bx+5,by+h/2+.5);
  });c.restore();}};

      yS:{position:'left',beginAtZero:true,ticks:{font:{family:'IBM Plex Mono',size:11},callback:v=>(v/1000)+'k'},title:{display:true,text:'張數'}},
      yP:{position:'right',beginAtZero:true,grid:{display:false},ticks:{font:{family:'IBM Plex Mono',size:11}},title:{display:true,text:'股價（元）'}},

    }}});

function styleChart(){
  const ds=chart.data.datasets;
  ds[0].borderColor=C.price;ds[0].pointHoverBackgroundColor=C.price;
  ds[1].borderColor=C.weight;ds[1].pointHoverBackgroundColor=C.weight;
  ds[3].borderColor=C.panel;ds[4].borderColor=C.panel;
  const sc=chart.options.scales;
  sc.x.ticks.color=C.muted;
  sc.yS.ticks.color=C.muted;sc.yS.grid={color:C.line};sc.yS.title.color=C.muted;sc.yS.border={color:C.line};
  sc.yP.ticks.color=C.price;sc.yP.title.color=C.muted;sc.yP.border={color:C.line};
  sc.yW.ticks.color=C.weight;sc.yW.title.color=C.muted;sc.yW.border={color:C.line};
  sc.x.border={color:C.line};
}

function render(){
  const sl=D.slice(lo,hi+1),a=sl[0],b=sl[sl.length-1];
  fromSel.value=lo;toSel.value=hi;
  $('rangeTag').textContent=a.d+' – '+b.d+'｜'+sl.length+' 個交易日';
  chart.data.labels=sl.map(r=>r.d);
  chart.data.datasets[0].data=sl.map(r=>r.p);
  chart.data.datasets[1].data=sl.map(r=>r.w);
  chart.data.datasets[2].data=sl.map(r=>r.s);
  chart.data.datasets[3].data=sl.map(r=>r.p);
  chart.data.datasets[4].data=sl.map(r=>r.w);
  chart.data.datasets[2].backgroundColor=sl.map((r,i)=>(i>0||lo>0)&&r.chg?C.barHi:C.bar);
  styleChart();chart.update();

  const dS=b.s-a.s,dP=(b.p/a.p-1)*100,dW=b.w-a.w,dM=mv(b)-mv(a);
  const pMax=Math.max(...sl.map(r=>r.p)),pMin=Math.min(...sl.map(r=>r.p));
  $('kS').innerHTML=fmt(b.s)+'<small>張</small>';
  $('dS').innerHTML='區間 <span class="'+cls(dS)+'">'+sgn(dS)+' 張</span>（'+a.d+' '+fmt(a.s)+'）';
  $('kP').innerHTML=fmt(b.p,b.p%1?1:0)+'<small>元</small>';
  $('dP').innerHTML='<span class="'+cls(dP)+'">'+sgn(dP,1,'%')+'</span>｜高 '+fmt(pMax,pMax%1?1:0)+' 低 '+fmt(pMin,pMin%1?1:0);
  $('kW').innerHTML=b.w.toFixed(2)+'<small>%</small>';
  $('dW').innerHTML='區間 <span class="'+cls(dW)+'">'+sgn(dW,2,' pp')+'</span>｜高 '+Math.max(...sl.map(r=>r.w)).toFixed(2)+'%';
  $('kM').innerHTML=fmt(mv(b),1)+'<small>億元</small>';
  $('dM').innerHTML='區間 <span class="'+cls(dM)+'">'+sgn(dM,1,' 億')+'</span>';

  const rows=sl.filter((r,i)=>r.chg&&(i>0||lo>0)).reverse();
  const add=rows.filter(r=>r.chg>0).reduce((s,r)=>s+r.chg,0),cut=rows.filter(r=>r.chg<0).reduce((s,r)=>s+r.chg,0);
  $('chgSum').textContent=rows.length?('共 '+rows.length+' 次｜加碼 '+fmt(add)+' 張、減碼 '+fmt(Math.abs(cut))+' 張'):'區間內無異動';
  $('tbody').innerHTML=rows.length?rows.map(r=>'<tr><td>'+r.d+'</td><td class="lbl"><span class="pill '+(r.chg>0?'add':'cut')+'">'+(r.chg>0?'加碼':'減碼')+'</span></td><td class="'+cls(r.chg)+'">'+sgn(r.chg)+'</td><td>'+fmt(r.s)+'</td><td>'+fmt(r.p,r.p%1?1:0)+'</td><td>'+r.w.toFixed(2)+'%</td><td class="'+cls(r.chg)+'">'+sgn(r.chg*1000*r.p/1e8,2,' 億')+'</td></tr>').join('')
    :'<tr><td colspan="7" class="empty">選定區間內張數沒有變動</td></tr>';
}

function setPreset(p){
  document.querySelectorAll('#presets button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===p));
  const idx=f=>D.findIndex(f),last=f=>{for(let i=N-1;i>=0;i--)if(f(D[i]))return i;return N-1};
  if(p==='all'){lo=0;hi=N-1}
  if(p==='1m'){lo=idx(r=>r.m===9&&r.dd>=1);hi=N-1}
  if(p==='3m'){lo=idx(r=>r.m===7&&r.dd>=1);hi=N-1}
  if(p==='q2'){lo=0;hi=last(r=>r.m<=6)}
  if(p==='q3'){lo=idx(r=>r.m===7);hi=last(r=>r.m<=9)}
  render();
}
document.querySelectorAll('#presets button').forEach(b=>b.addEventListener('click',()=>setPreset(b.dataset.p)));
function clearPreset(){document.querySelectorAll('#presets button').forEach(b=>b.setAttribute('aria-pressed','false'))}
fromSel.addEventListener('change',()=>{lo=+fromSel.value;if(lo>=hi)hi=Math.min(N-1,lo+1);clearPreset();render()});
toSel.addEventListener('change',()=>{hi=+toSel.value;if(hi<=lo)lo=Math.max(0,hi-1);clearPreset();render()});
const mq=matchMedia('(prefers-color-scheme: dark)');
const reTheme=()=>{readColors();render()};
mq.addEventListener?.('change',reTheme);
new MutationObserver(reTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
render();
</script>
